[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc2agent"
version = "0.1.0"
description = "A StarCraft II agent that learns by reinforcement learning and self-play"
requires-python = ">=3.10"
dependencies = [
    "burnysc2>=7.0",
    "gymnasium>=0.29",
    "loguru",
    "numpy>=1.24",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
    "torch>=2.2",
    "tensorboard>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["sc2agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
